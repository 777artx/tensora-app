[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Try to keep Collaborative Deploy Preview drawer off (UI injects it either way).
  NETLIFY_COLLABORATION = "false"

[functions]
  node_bundler = "esbuild"

# Pretty Lab/docs URLs → static shells in /public
# force=true so these win over Next 404s on Netlify
[[redirects]]
  from = "/favicon.ico"
  to = "/landing/favicon.ico"
  status = 200
  force = true

[[redirects]]
  from = "/docs"
  to = "/docs/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/docs/"
  to = "/docs/index.html"
  status = 200
  force = true

